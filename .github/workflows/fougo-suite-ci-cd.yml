name: FOUGO EXTERNAL — Full Suite CI/CD & Multi-Platform Builder

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'iOS License Mode (online or offline)'
        required: true
        default: 'online'
        type: choice
        options:
          - online
          - offline
      api_base_url:
        description: 'API Base URL for Online iOS Build (e.g. https://auth.fougoexternal.com/api/v1)'
        required: false
        default: 'https://auth.fougoexternal.com/api/v1'
        type: string
      deploy_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. WEB LOGIN PORTAL & AUTHORITATIVE BACKEND API
  # =========================================================================
  build-web-and-api:
    name: Build Web Login Portal & Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Run Authoritative Integration Tests
        run: npx tsx tests/run_tests.ts

      - name: Build React SPA Frontend
        run: npm run build

      - name: Verify Backend Server Entry
        run: |
          node -e "
            const { DatabaseSync } = require('node:sqlite');
            const crypto = require('node:crypto');
            console.log('[CI CHECK] Node 22 built-in SQLite and Crypto verified.');
          "

      - name: Package Web & API Distribution
        run: |
          mkdir -p dist-package
          cp -r dist dist-package/
          cp -r src/server dist-package/server
          cp server.ts dist-package/
          cp package.json dist-package/
          cp .env.example dist-package/
          cp ARCHITECTURE_REPORT.md dist-package/
          cd dist-package && zip -r ../fougo-web-backend-bundle.zip ./*

      - name: Upload Web & API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-web-backend-bundle
          path: fougo-web-backend-bundle.zip
          retention-days: 14

  # =========================================================================
  # 2. TELEGRAM MANAGEMENT BOT
  # =========================================================================
  build-telegram-bot:
    name: Validate & Package Telegram Management Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r telegram-bot/requirements.txt

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile telegram-bot/bot.py
          echo "Telegram bot syntax validated successfully."

      - name: Package Telegram Bot
        run: |
          mkdir -p bot-package
          cp telegram-bot/bot.py bot-package/
          cp telegram-bot/requirements.txt bot-package/
          cp telegram-bot/.env.example bot-package/
          cd bot-package && zip -r ../fougo-telegram-bot-bundle.zip ./*

      - name: Upload Telegram Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: fougo-telegram-bot-bundle.zip
          retention-days: 14

  # =========================================================================
  # 3. iOS IPA & MACH-O BUILDER (macOS Runner with Native Apple Clang)
  # =========================================================================
  build-ios-ipa:
    name: Build FOUGO EXTERNAL iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Mach-O Hardening Tools (LIEF)
        run: pip install lief

      - name: Locate Apple iPhoneOS SDK
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk_path=$SDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Using Apple iPhoneOS SDK: $SDK_PATH"

      - name: Configure iOS Source for Target Mode
        run: |
          SOURCE_DIR="ios-app/MYZO-EXTERNAL-SOURCE/app/ff_manager"
          if [ ! -d "$SOURCE_DIR" ]; then
            echo "Extracting iOS source from workspace asset..."
            mkdir -p ios-app
            unzip -q -o public/assets/aistudio/MYZO_EXTERNAL_NEW_7c96a2e1.zip -d ios-app/
          fi

          BUILD_MODE="${{ github.event.inputs.build_mode || 'online' }}"
          API_URL="${{ github.event.inputs.api_base_url || 'https://auth.fougoexternal.com/api/v1' }}"

          echo "Target Build Mode: $BUILD_MODE"

          if [ "$BUILD_MODE" = "online" ]; then
            echo "Injecting API Base URL: $API_URL into main.m"
            sed -i '' "s|static NSString \*FFAPIBaseURL(void) { return @\"\"; }|static NSString \*FFAPIBaseURL(void) { return @\"$API_URL\"; }|g" "$SOURCE_DIR/main.m"
            echo "API Base URL configured."
          fi

      - name: Compile Mach-O & Package IPA
        run: |
          SOURCE_DIR="ios-app/MYZO-EXTERNAL-SOURCE/app/ff_manager"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          BUILD_MODE="${{ github.event.inputs.build_mode || 'online' }}"

          mkdir -p build_output/Payload/FOUGO\ EXTERNAL.app

          EXTRA_FLAGS=""
          if [ "$BUILD_MODE" = "offline" ]; then
            EXTRA_FLAGS="-DFM_OFFLINE_BUILD=1"
          fi

          echo "Compiling arm64 Mach-O binary..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident \
            -Wno-deprecated-declarations \
            $EXTRA_FLAGS -DFM_RELEASE_BUILD=1 -DFM_REQUIRE_SIGNED_RESPONSES=1 \
            -I"$SOURCE_DIR" -c "$SOURCE_DIR/main.m" -o build_output/main.o

          echo "Linking executable..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -e _main -dead_strip build_output/main.o \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Security -framework UniformTypeIdentifiers \
            -lobjc -lSystem -o "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL"

          strip -x "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL"
          cp "$SOURCE_DIR/Info.plist" "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"

          if [ -f "$SOURCE_DIR/Myzoexternel.jpg" ]; then
            cp "$SOURCE_DIR/Myzoexternel.jpg" "build_output/Payload/FOUGO EXTERNAL.app/fougoExternalBackground.jpg"
          fi

          if [ "$BUILD_MODE" = "offline" ] && [ -d "$SOURCE_DIR/resources/offline" ]; then
            mkdir -p "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache"
            cp "$SOURCE_DIR/resources/offline/"*.robotexternal "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache/" 2>/dev/null || true
          fi

          codesign -s - --force --deep "build_output/Payload/FOUGO EXTERNAL.app"

          IPA_NAME="FOUGO-EXTERNAL-v1.0.0-${BUILD_MODE}.ipa"
          cd build_output
          zip -qry "../$IPA_NAME" Payload/
          cd ..

          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "Generated IPA: $IPA_NAME"
          cat "$IPA_NAME.sha256"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-ios-ipa
          path: |
            FOUGO-EXTERNAL-*.ipa
            FOUGO-EXTERNAL-*.sha256
          retention-days: 14

  # =========================================================================
  # 4. MASTER BUNDLE & GITHUB RELEASE PUBLISHING
  # =========================================================================
  release-unified-package:
    name: Consolidate Master Release Suite
    needs: [build-web-and-api, build-telegram-bot, build-ios-ipa]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Web & API Bundle
        uses: actions/download-artifact@v4
        with:
          name: fougo-web-backend-bundle
          path: release_staging/web

      - name: Download Telegram Bot Bundle
        uses: actions/download-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: release_staging/bot

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: fougo-ios-ipa
          path: release_staging/ipa

      - name: Assemble Master Suite Archive
        run: |
          mkdir -p master_release
          cp release_staging/web/fougo-web-backend-bundle.zip master_release/
          cp release_staging/bot/fougo-telegram-bot-bundle.zip master_release/
          cp release_staging/ipa/*.ipa master_release/ 2>/dev/null || true
          cp release_staging/ipa/*.sha256 master_release/ 2>/dev/null || true
          cp ARCHITECTURE_REPORT.md master_release/
          cp .env.example master_release/

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="latest-build"
          fi

          MASTER_ZIP="FOUGO-EXTERNAL-SUITE-${VERSION}.zip"
          cd master_release && zip -r "../$MASTER_ZIP" ./* && cd ..
          echo "Master release package generated: $MASTER_ZIP"

      - name: Upload Master Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-external-master-suite
          path: FOUGO-EXTERNAL-SUITE-*.zip
          retention-days: 30

      - name: Create GitHub Release (On Tag or Release Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-release' }}
          name: FOUGO EXTERNAL Production Suite ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## FOUGO EXTERNAL — Unified Platform Release

            This release contains the complete, integrated production suite for **FOUGO EXTERNAL**:

            ### Components Included:
            1. **Liquid Glass Web Portal & Authoritative API**:
               - Dark graphite & electric blue liquid glass interface.
               - Server-side auth with salted scrypt, session rotation, and sliding-window rate limiting.
               - Full REST API (`/api/v1/auth/*`, `/api/v1/keys/*`, `/api/v1/license/*`).
            2. **Telegram Management Bot**:
               - Button-only Owner & Seller administration panel.
               - Connected directly to the authoritative database with atomic quota enforcement.
            3. **FOUGO EXTERNAL iOS Mach-O / IPA**:
               - Compiled arm64 binary with RSA-PSS-SHA256 signature verification.
               - Includes SHA-256 integrity checksum.

            ### Verification & Integrity:
            All automated tests (22/22) passed prior to artifact bundling.
          files: |
            master_release/*
            FOUGO-EXTERNAL-SUITE-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
