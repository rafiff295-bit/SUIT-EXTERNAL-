name: FOUGO EXTERNAL — Full Suite CI/CD & Multi-Platform Builder

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'iOS License Mode (online or offline)'
        required: true
        default: 'online'
        type: choice
        options:
          - online
          - offline
      api_base_url:
        description: 'API Base URL for Online iOS Build (e.g. https://auth.fougoexternal.com/api/v1)'
        required: false
        default: 'https://auth.fougoexternal.com/api/v1'
        type: string
      deploy_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  # 1. TELEGRAM MANAGEMENT BOT
  build-telegram-bot:
    name: Validate & Package Telegram Management Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "telegram-bot/requirements.txt" ]; then
            pip install -r telegram-bot/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install python-telegram-bot==21.10
          fi

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          BOT_FILE=$(find . -name "bot.py" | head -n 1)
          if [ -n "$BOT_FILE" ]; then
            python -m py_compile "$BOT_FILE"
            echo "Telegram bot syntax validated successfully."
          fi

      - name: Package Telegram Bot
        run: |
          mkdir -p bot-package
          cp telegram-bot/bot.py bot-package/ 2>/dev/null || cp $(find . -name "bot.py" | head -n 1) bot-package/
          cp telegram-bot/requirements.txt bot-package/ 2>/dev/null || cp requirements.txt bot-package/
          cp telegram-bot/.env.example bot-package/ 2>/dev/null || true
          cd bot-package && zip -r ../fougo-telegram-bot-bundle.zip ./*

      - name: Upload Telegram Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: fougo-telegram-bot-bundle.zip
          retention-days: 14

  # 2. iOS IPA BUILDER (macOS Runner with Native Apple Clang)
  build-ios-ipa:
    name: Build FOUGO EXTERNAL iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Locate Apple iPhoneOS SDK
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk_path=$SDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Using Apple iPhoneOS SDK: $SDK_PATH"

      - name: Locate and Configure iOS Source
        id: source
        run: |
          MAIN_FILE=$(find . -name "main.m" -not -path "*/.*" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            echo "Searching for zipped iOS source..."
            ZIP_FILE=$(find . -name "*.zip" | grep -i "MYZO" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p ios-extracted
              unzip -q -o "$ZIP_FILE" -d ios-extracted/
              MAIN_FILE=$(find ios-extracted -name "main.m" | head -n 1)
            fi
          fi

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: main.m could not be located in repository."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$MAIN_FILE")
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "Found iOS Source in: $SOURCE_DIR"

          BUILD_MODE="${{ github.event.inputs.build_mode || 'online' }}"
          API_URL="${{ github.event.inputs.api_base_url || 'https://auth.fougoexternal.com/api/v1' }}"

          if [ "$BUILD_MODE" = "online" ]; then
            echo "Configuring API Base URL: $API_URL"
            sed -i '' "s|static NSString \*FFAPIBaseURL(void) { return @\"\"; }|static NSString \*FFAPIBaseURL(void) { return @\"$API_URL\"; }|g" "$MAIN_FILE"
          fi

      - name: Compile Mach-O & Package IPA
        run: |
          SOURCE_DIR="${{ steps.source.outputs.source_dir }}"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          BUILD_MODE="${{ github.event.inputs.build_mode || 'online' }}"

          mkdir -p build_output/Payload/FOUGO\ EXTERNAL.app

          EXTRA_FLAGS=""
          if [ "$BUILD_MODE" = "offline" ]; then
            EXTRA_FLAGS="-DFM_OFFLINE_BUILD=1"
          fi

          echo "Compiling arm64 Mach-O binary..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident \
            -Wno-deprecated-declarations \
            $EXTRA_FLAGS -DFM_RELEASE_BUILD=1 -DFM_REQUIRE_SIGNED_RESPONSES=1 \
            -I"$SOURCE_DIR" -c "$SOURCE_DIR/main.m" -o build_output/main.o

          echo "Linking executable..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -e _main -dead_strip build_output/main.o \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Security -framework UniformTypeIdentifiers \
            -lobjc -lSystem -o "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL"

          strip -x "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL"

          if [ -f "$SOURCE_DIR/Info.plist" ]; then
            cp "$SOURCE_DIR/Info.plist" "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
          fi

          if [ -f "$SOURCE_DIR/fougoExternalBackground.jpg" ]; then
            cp "$SOURCE_DIR/fougoExternalBackground.jpg" "build_output/Payload/FOUGO EXTERNAL.app/fougoExternalBackground.jpg"
          elif [ -f "$SOURCE_DIR/Myzoexternel.jpg" ]; then
            cp "$SOURCE_DIR/Myzoexternel.jpg" "build_output/Payload/FOUGO EXTERNAL.app/fougoExternalBackground.jpg"
          fi

          if [ "$BUILD_MODE" = "offline" ] && [ -d "$SOURCE_DIR/resources/offline" ]; then
            mkdir -p "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache"
            cp "$SOURCE_DIR/resources/offline/"*.robotexternal "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache/" 2>/dev/null || true
          fi

          codesign -s - --force --deep "build_output/Payload/FOUGO EXTERNAL.app" 2>/dev/null || true

          IPA_NAME="FOUGO-EXTERNAL-v1.0.0-${BUILD_MODE}.ipa"
          cd build_output
          zip -qry "../$IPA_NAME" Payload/
          cd ..

          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"
          echo "Generated IPA: $IPA_NAME"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-ios-ipa
          path: |
            FOUGO-EXTERNAL-*.ipa
            FOUGO-EXTERNAL-*.sha256
          retention-days: 14

  # 3. CONSOLIDATE MASTER RELEASE
  release-unified-package:
    name: Consolidate Master Release Suite
    needs: [build-telegram-bot, build-ios-ipa]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Telegram Bot Bundle
        uses: actions/download-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: release_staging/bot

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: fougo-ios-ipa
          path: release_staging/ipa

      - name: Assemble Master Suite Archive
        run: |
          mkdir -p master_release
          cp release_staging/bot/fougo-telegram-bot-bundle.zip master_release/ 2>/dev/null || true
          cp release_staging/ipa/*.ipa master_release/ 2>/dev/null || true
          cp release_staging/ipa/*.sha256 master_release/ 2>/dev/null || true
          cp ARCHITECTURE_REPORT.md master_release/ 2>/dev/null || true

          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION="latest-build"
          fi

          MASTER_ZIP="FOUGO-EXTERNAL-SUITE-${VERSION}.zip"
          cd master_release && zip -r "../$MASTER_ZIP" ./* && cd ..
          echo "Master release package generated: $MASTER_ZIP"

      - name: Upload Master Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-external-master-suite
          path: FOUGO-EXTERNAL-SUITE-*.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.deploy_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0-release' }}
          name: FOUGO EXTERNAL Production Suite ${{ github.ref_name || 'v1.0.0' }}
          body: |
            ## FOUGO EXTERNAL — Release
            * **FOUGO EXTERNAL iOS IPA:** Built with native Liquid Glass Login Card and geometric F monogram.
            * **Telegram Management Bot:** Built with button-only Owner/Seller administration and license key generator.
          files: |
            master_release/*
            FOUGO-EXTERNAL-SUITE-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
