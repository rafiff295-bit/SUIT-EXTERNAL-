name: FOUGO EXTERNAL Suite — iOS IPA & Telegram Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target:
        description: 'What to run (all, build-ios-ipa, or run-telegram-bot)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'build-ios-ipa'
          - 'run-telegram-bot'
      telegram_bot_token:
        description: 'Telegram BotFather Token (e.g. 123456789:ABCdef...)'
        required: false
        default: ''
        type: string
      admin_ids:
        description: 'Admin Telegram User IDs (comma-separated, e.g. 123456789)'
        required: false
        default: ''
        type: string
      build_mode:
        description: 'IPA Build Mode (offline or online)'
        required: true
        default: 'offline'
        type: choice
        options:
          - offline
          - online

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. NATIVE iOS IPA & MACH-O BUILDER (Apple Clang on macOS Runner)
  # =========================================================================
  build-ios-ipa:
    name: Build FOUGO EXTERNAL iOS IPA
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'build-ios-ipa'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate Apple iPhoneOS SDK
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk_path=$SDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Apple iPhoneOS SDK located at: $SDK_PATH"

      - name: Locate and Extract iOS Source
        id: source
        run: |
          MAIN_FILE=$(find . -name "main.m" -not -path "*/.*" | head -n 1)
          if [ -z "$MAIN_FILE" ]; then
            ZIP_IOS=$(find . -maxdepth 2 -name "*.zip" | grep -iE "external|myzo|ios" | head -n 1)
            if [ -z "$ZIP_IOS" ]; then
              ZIP_IOS=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            fi
            if [ -n "$ZIP_IOS" ]; then
              echo "Extracting iOS source from archive: $ZIP_IOS"
              mkdir -p ios-extracted
              unzip -q -o "$ZIP_IOS" -d ios-extracted/
              MAIN_FILE=$(find ios-extracted -name "main.m" -not -path "*/.*" | head -n 1)
            fi
          fi

          if [ -z "$MAIN_FILE" ] || [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: main.m could not be located in repository or extracted archives."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$MAIN_FILE")
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "main_file=$MAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "Found iOS source: $MAIN_FILE in $SOURCE_DIR"

      - name: Self-Healing Source Patch & Brand Sanitization
        run: |
          MAIN_FILE="${{ steps.source.outputs.main_file }}"
          SOURCE_DIR="${{ steps.source.outputs.source_dir }}"
          echo "Patching source file: $MAIN_FILE"

          if [ -f "scripts/patch_fougo.py" ]; then
            python3 scripts/patch_fougo.py "$MAIN_FILE"
          else
            echo "" | base64 -d | python3 - "$MAIN_FILE"
          fi

          if [ -f "$SOURCE_DIR/Info.plist" ]; then
            python3 -c "import sys; p = sys.argv[1]; c = open(p, errors='ignore').read().replace('MYZO EXTERNAL', 'FOUGO EXTERNAL').replace('MYZO', 'FOUGO'); open(p, 'w').write(c); print('[OK] Info.plist updated')" "$SOURCE_DIR/Info.plist"
          fi

      - name: Compile Mach-O and Package IPA
        run: |
          SOURCE_DIR="${{ steps.source.outputs.source_dir }}"
          MAIN_FILE="${{ steps.source.outputs.main_file }}"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          BUILD_MODE="${{ github.event.inputs.build_mode || 'offline' }}"

          mkdir -p "build_output/Payload/FOUGO EXTERNAL.app"

          EXTRA_FLAGS="-DFM_OFFLINE_BUILD=1"
          if [ "$BUILD_MODE" = "online" ]; then
            EXTRA_FLAGS=""
          fi

          echo "Compiling arm64 Mach-O binary with Apple Clang..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident \
            -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function \
            $EXTRA_FLAGS -DFM_RELEASE_BUILD=1 \
            -I"$SOURCE_DIR" \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Security -framework UniformTypeIdentifiers \
            -lobjc -lSystem \
            "$MAIN_FILE" -o "build_output/Payload/FOUGO EXTERNAL.app/fougoexternal"

          cp "build_output/Payload/FOUGO EXTERNAL.app/fougoexternal" "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL"
          strip -x "build_output/Payload/FOUGO EXTERNAL.app/fougoexternal" 2>/dev/null || true
          strip -x "build_output/Payload/FOUGO EXTERNAL.app/FOUGO EXTERNAL" 2>/dev/null || true

          if [ -f "$SOURCE_DIR/Info.plist" ]; then
            cp "$SOURCE_DIR/Info.plist" "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
          else
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<plist version="1.0"><dict>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleDisplayName</key><string>FOUGO EXTERNAL</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleExecutable</key><string>fougoexternal</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleIdentifier</key><string>com.apple.mobile.MobileHouseArrest</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleName</key><string>FOUGO EXTERNAL</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundlePackageType</key><string>APPL</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>CFBundleVersion</key><string>1</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>LSRequiresIPhoneOS</key><true/>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>MinimumOSVersion</key><string>15.0</string>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '<key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
            echo '</dict></plist>' >> "build_output/Payload/FOUGO EXTERNAL.app/Info.plist"
          fi

          find "$SOURCE_DIR" -maxdepth 2 -name "*.jpg" -exec cp {} "build_output/Payload/FOUGO EXTERNAL.app/fougoExternalBackground.jpg" \; 2>/dev/null || true

          if [ -d "$SOURCE_DIR/resources/offline" ]; then
            mkdir -p "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache"
            cp "$SOURCE_DIR/resources/offline/"*.robotexternal "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache/" 2>/dev/null || true
            cp "$SOURCE_DIR/resources/offline/"*.fougoexternal "build_output/Payload/FOUGO EXTERNAL.app/OfflineCache/" 2>/dev/null || true
          fi

          codesign -s - --force --deep "build_output/Payload/FOUGO EXTERNAL.app" 2>/dev/null || true

          IPA_NAME="FOUGO-EXTERNAL-v1.0.0.ipa"
          cd build_output && zip -qry "../$IPA_NAME" Payload/ && cd ..
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"

          echo "[OK] Built $IPA_NAME"
          cat "$IPA_NAME.sha256"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-ios-ipa
          path: |
            FOUGO-EXTERNAL-*.ipa
            FOUGO-EXTERNAL-*.sha256
          retention-days: 14

  # =========================================================================
  # 2. TELEGRAM MANAGEMENT BOT PACKAGING & LIVE HOST (Ubuntu Runner)
  # =========================================================================
  fougo-telegram-bot:
    name: Telegram Bot Package & Live Host
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'run-telegram-bot'
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_IDS: ${{ inputs.admin_ids || secrets.ADMIN_IDS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and Extract Telegram Bot Source
        id: bot-extract
        run: |
          mkdir -p bot-package
          BOT_ZIP=$(find . -maxdepth 2 -name "*.zip" | grep -iE "telegram|bot|panel" | head -n 1)
          if [ -n "$BOT_ZIP" ]; then
            echo "Extracting Telegram archive: $BOT_ZIP"
            mkdir -p extracted_bot
            unzip -q -o "$BOT_ZIP" -d extracted_bot/
          fi

          BOT_SRC=$(find . -name "bot.py" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$BOT_SRC" ] && [ -f "$BOT_SRC" ]; then
            echo "Found bot source at: $BOT_SRC"
            cp "$BOT_SRC" bot-package/bot.py
          fi

          REQ_SRC=$(find . -name "requirements.txt" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$REQ_SRC" ] && [ -f "$REQ_SRC" ]; then
            cp "$REQ_SRC" bot-package/requirements.txt
          else
            echo "python-telegram-bot==21.10" > bot-package/requirements.txt
          fi

          ENV_SRC=$(find . -name ".env.example" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$ENV_SRC" ] && [ -f "$ENV_SRC" ]; then
            cp "$ENV_SRC" bot-package/.env.example
          else
            echo 'TELEGRAM_BOT_TOKEN="your_telegram_bot_token"' > bot-package/.env.example
            echo 'ADMIN_IDS="123456789"' >> bot-package/.env.example
          fi

      - name: Sanitize Branding and Install Bot Dependencies
        run: |
          if [ -f "bot-package/bot.py" ]; then
            if [ -f "scripts/patch_bot.py" ]; then
              python3 scripts/patch_bot.py
            else
              echo "" | base64 -d | python3 -
            fi
            python3 -m py_compile bot-package/bot.py
            echo "[OK] Bot syntax validated successfully"
          fi
          pip install --no-cache-dir -r bot-package/requirements.txt

      - name: Package Telegram Bot Bundle
        run: |
          echo "# FOUGO EXTERNAL — Telegram Bot" > bot-package/README.md
          echo "" >> bot-package/README.md
          echo "## Quick Start" >> bot-package/README.md
          echo "1. pip install -r requirements.txt" >> bot-package/README.md
          echo "2. cp .env.example .env (set TELEGRAM_BOT_TOKEN)" >> bot-package/README.md
          echo "3. python bot.py" >> bot-package/README.md
          cd bot-package && zip -qry ../fougo-telegram-bot-bundle.zip . && cd ..
          echo "[OK] Created fougo-telegram-bot-bundle.zip"

      - name: Upload Telegram Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: fougo-telegram-bot-bundle.zip
          retention-days: 14

      - name: Launch & Run Telegram Bot Polling Host
        run: |
          RESOLVED_TOKEN="$TELEGRAM_BOT_TOKEN"
          if [ -z "$RESOLVED_TOKEN" ]; then
            if [ -f ".env" ]; then
              RESOLVED_TOKEN=$(grep -E "^TELEGRAM_BOT_TOKEN=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'" | tr -d '[:space:]')
            fi
          fi

          if [ -z "$RESOLVED_TOKEN" ]; then
            echo "======================================================================"
            echo "⚠️ [ATTENTION] TELEGRAM_BOT_TOKEN IS NOT CONFIGURED YET"
            echo "======================================================================"
            echo "Your Telegram Bot Bundle has been successfully packaged & uploaded to Artifacts!"
            echo "To keep the bot live 24/7, set TELEGRAM_BOT_TOKEN in Repository Secrets."
            echo "======================================================================"
            exit 0
          fi

          echo "======================================================================"
          echo "🟢 TELEGRAM_BOT_TOKEN DETECTED! Verifying connection with Telegram..."
          BOT_INFO=$(curl -s "https://api.telegram.org/bot${RESOLVED_TOKEN}/getMe")
          echo "Telegram Response: $BOT_INFO"
          echo "======================================================================"

          export TELEGRAM_BOT_TOKEN="$RESOLVED_TOKEN"
          cd bot-package
          echo "🟢 [ONLINE] FOUGO Telegram Bot is now polling 24/7..."
          while true; do
            echo "[$(date -u)] Running python3 bot.py..."
            python3 bot.py || true
            echo "[$(date -u)] Process exited. Restarting in 5s..."
            sleep 5
          done
