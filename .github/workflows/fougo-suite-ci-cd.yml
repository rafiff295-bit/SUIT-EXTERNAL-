name: FOUGO EXTERNAL Suite — iOS IPA & Telegram Bot

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      target:
        description: 'What to run (all, build-ios-ipa, or run-telegram-bot)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'build-ios-ipa'
          - 'run-telegram-bot'
      telegram_bot_token:
        description: 'Telegram BotFather Token (e.g. 123456789:ABCdef...)'
        required: false
        default: ''
        type: string
      admin_ids:
        description: 'Admin Telegram User IDs (comma-separated, e.g. 123456789)'
        required: false
        default: ''
        type: string
      build_mode:
        description: 'IPA Build Mode (offline or online)'
        required: true
        default: 'offline'
        type: choice
        options:
          - offline
          - online

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # 1. NATIVE iOS IPA & MACH-O BUILDER (Apple Clang on macOS Runner)
  # =========================================================================
  build-ios-ipa:
    name: Build FOUGO EXTERNAL iOS IPA
    runs-on: macos-14
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'build-ios-ipa'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate Apple iPhoneOS SDK
        id: sdk
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "sdk_path=$SDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Apple iPhoneOS SDK located at: $SDK_PATH"

      - name: Locate and Extract iOS Source
        id: source
        run: |
          ZIP_IOS=$(find . -maxdepth 2 -name "*.zip" | grep -iE "external|myzo|ios" | head -n 1)
          if [ -z "$ZIP_IOS" ]; then
            ZIP_IOS=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          fi

          if [ -n "$ZIP_IOS" ]; then
            echo "Extracting iOS source from archive: $ZIP_IOS"
            rm -rf ios-extracted
            mkdir -p ios-extracted
            unzip -q -o "$ZIP_IOS" -d ios-extracted/
            MAIN_FILE=$(find ios-extracted -name "main.m" -not -path "*/.*" | head -n 1)
          else
            MAIN_FILE=$(find . -name "main.m" -not -path "*/.*" | head -n 1)
          fi

          if [ -z "$MAIN_FILE" ] || [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: main.m could not be located in repository or extracted archives."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$MAIN_FILE")
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "main_file=$MAIN_FILE" >> "$GITHUB_OUTPUT"
          echo "Found iOS source: $MAIN_FILE in $SOURCE_DIR"

      - name: Self-Healing Source Patch & Brand Sanitization
        run: |
          MAIN_FILE="${{ steps.source.outputs.main_file }}"
          SOURCE_DIR="${{ steps.source.outputs.source_dir }}"
          echo "Patching source files in: $SOURCE_DIR"

          python3 -c "import sys, re, os; f=sys.argv[1]; c=open(f, encoding=\"utf-8\", errors=\"ignore\").read(); c=c.replace(\"MYZO PANEL\",\"FOUGO EXTERNAL\").replace(\"MYZO EXTERNAL\",\"FOUGO EXTERNAL\").replace(\"MYZO\",\"FOUGO\").replace(\"Myzo\",\"Fougo\").replace(\"gojoImage\",\"fougoImage\"); c=re.sub(r\"\[FFSha256String\([^)]*\)\s*isEqualToString:[^\]]*\]\", \"YES\", c); c=re.sub(r\"\[FFSHA256String\([^)]*\)\s*isEqualToString:[^\]]*\]\", \"YES\", c); c=re.sub(r\"isEqualToString:\s*\]\", \"isEqualToString:@\\\"\\\"]\", c); p=\"#import \\\"ProtectedConfig.h\\\"\\n#ifndef LC_DYLD_EXPORTS_TRIE\\n#define LC_DYLD_EXPORTS_TRIE (0x33 | LC_REQ_DYLD)\\n#endif\\nstatic NSString *const FFBookmarkKey = @\\\"FMSelectedFolderBookmark\\\";\\nstatic NSString *const FFBackupSuffix = @\\\".fmbackup\\\";\\nstatic NSString *const FFActiveProfileKey = @\\\"FMActiveProfile\\\";\\nstatic NSString *const FFKeychainService = @\\\"com.fougo.fougoexternal.protected\\\";\\nstatic NSString *const FFDeviceAccount = @\\\"fm-installation-id\\\";\\nstatic NSString *const FFLegacyLicenseAccount = @\\\"fm-owner-license\\\";\\nstatic NSString *const FFAccessTokenAccount = @\\\"fm-session-access-token\\\";\\nstatic NSString *const FFRefreshTokenAccount = @\\\"fm-session-refresh-token\\\";\\nstatic NSString *const FFAutoClipboardLicenseDigestKey = @\\\"FMAutoClipboardLicenseDigest\\\";\\nstatic NSString *const FFOwnerTelegram = @\\\"@cheatgnexusiphone\\\";\\nstatic NSString *const FFOfficialChannelURL = @\\\"https://t.me/cheatgnexusiphone\\\";\\nstatic inline NSString *FFAPIBaseURL(void) { return @\\\"\\\"; }\\nstatic inline BOOL FFBrandIdentityIsValid(void) { return YES; }\\nstatic inline NSString *FFSHA256String(NSString *v) { if (!v) return @\\\"\\\"; NSData *d = [v dataUsingEncoding:NSUTF8StringEncoding]; unsigned char dig[CC_SHA256_DIGEST_LENGTH]; CC_SHA256(d.bytes, (CC_LONG)d.length, dig); NSMutableString *r = [NSMutableString stringWithCapacity:64]; for (int i=0; i<CC_SHA256_DIGEST_LENGTH; i++) [r appendFormat:@\\\"%02x\\\", dig[i]]; return r; }\\nstatic inline NSString *FFSha256String(NSString *v) { return FFSHA256String(v); }\\nstatic NSString *const FFBundleIDFreeFireTH = @\\\"com.dts.freefireth\\\";\\nstatic NSString *const FFBundleIDFreeFireMAX = @\\\"com.dts.freefiremax\\\";\\nstatic NSString *const FFHologramShaderFilename = @\\\"shaders.HPt9DZviTSXL9hpGW9QNOMigNLA~3D\\\";\\nstatic NSString *const FFThreeDShaderFilename = @\\\"optionalavatarres_commonab_shader\\\";\\nstatic NSString *const FFHologramStateKey = @\\\"FMHologramPersistentState\\\";\\nstatic NSURL *FFFindGameAssetBundles(NSURL *root, NSError **error);\\n\"; s=c.find(\"#import \\\"ProtectedConfig.h\\\"\"); e=c.find(\"typedef void (*MCMFilzaStartFunction)\"); (c := c[:s] + p + c[e:]) if (s != -1 and e != -1 and s < e) else None; open(f, \"w\", encoding=\"utf-8\").write(c); print(\"[OK] Source main.m patched successfully.\")" "$MAIN_FILE"

          python3 -c "import sys, os; d=sys.argv[1]; p=os.path.join(d, 'Info.plist'); (open(p, 'w', encoding='utf-8').write(open(p, encoding='utf-8', errors='ignore').read().replace('MYZO PANEL','FOUGO EXTERNAL').replace('MYZO EXTERNAL','FOUGO EXTERNAL').replace('MYZO','FOUGO').replace('Myzo','Fougo')) if os.path.exists(p) else None); print('[OK] Info.plist updated successfully.')" "$SOURCE_DIR"

      - name: Compile Mach-O and Package IPA
        run: |
          SOURCE_DIR="${{ steps.source.outputs.source_dir }}"
          MAIN_FILE="${{ steps.source.outputs.main_file }}"
          SDK_PATH="${{ steps.sdk.outputs.sdk_path }}"
          BUILD_MODE="${{ github.event.inputs.build_mode || 'offline' }}"

          APP_DIR="build_output/Payload/FougoExternal.app"
          rm -rf build_output
          mkdir -p "$APP_DIR"

          EXTRA_FLAGS="-DFM_OFFLINE_BUILD=1"
          if [ "$BUILD_MODE" = "online" ]; then
            EXTRA_FLAGS=""
          fi

          echo "Compiling arm64 Mach-O binary with Apple Clang..."
          clang -arch arm64 -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" \
            -fobjc-arc -Os -fstack-protector-strong -fvisibility=hidden -fomit-frame-pointer -fno-ident \
            -Wno-deprecated-declarations -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration \
            $EXTRA_FLAGS -DFM_RELEASE_BUILD=1 \
            -I"$SOURCE_DIR" \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Security -framework UniformTypeIdentifiers \
            -lobjc -lSystem \
            "$MAIN_FILE" -o "$APP_DIR/fougoexternal"

          strip -x "$APP_DIR/fougoexternal" 2>/dev/null || true
          chmod 755 "$APP_DIR/fougoexternal"

          # Prepare Info.plist with valid bundle configuration
          if [ -f "$SOURCE_DIR/Info.plist" ]; then
            cp "$SOURCE_DIR/Info.plist" "$APP_DIR/Info.plist"
          else
            echo '<?xml version="1.0" encoding="UTF-8"?>' > "$APP_DIR/Info.plist"
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$APP_DIR/Info.plist"
            echo '<plist version="1.0"><dict>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleDisplayName</key><string>FOUGO EXTERNAL</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleExecutable</key><string>fougoexternal</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleIdentifier</key><string>com.apple.mobile.MobileHouseArrest</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleName</key><string>FougoExternal</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundlePackageType</key><string>APPL</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleShortVersionString</key><string>1.0</string>' >> "$APP_DIR/Info.plist"
            echo '<key>CFBundleVersion</key><string>1</string>' >> "$APP_DIR/Info.plist"
            echo '<key>LSRequiresIPhoneOS</key><true/>' >> "$APP_DIR/Info.plist"
            echo '<key>MinimumOSVersion</key><string>15.0</string>' >> "$APP_DIR/Info.plist"
            echo '<key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>' >> "$APP_DIR/Info.plist"
            echo '</dict></plist>' >> "$APP_DIR/Info.plist"
          fi

          # Ensure Info.plist retains com.apple.mobile.MobileHouseArrest as requested
          python3 -c "import plistlib, sys; p='$APP_DIR/Info.plist'; d=plistlib.load(open(p,'rb')); d['CFBundleIdentifier']='com.apple.mobile.MobileHouseArrest'; d['CFBundleExecutable']='fougoexternal'; d['CFBundleDisplayName']='FOUGO EXTERNAL'; d['CFBundleName']='FougoExternal'; plistlib.dump(d,open(p,'wb'))"

          # App icon assets
          PNG_ICON=$(find "$SOURCE_DIR" -name "*.png" | head -n 1)
          if [ -n "$PNG_ICON" ]; then
            cp "$PNG_ICON" "$APP_DIR/AppIcon60x60@2x.png" 2>/dev/null || true
            cp "$PNG_ICON" "$APP_DIR/AppIcon60x60@3x.png" 2>/dev/null || true
            cp "$PNG_ICON" "$APP_DIR/AppIcon76x76@2x~ipad.png" 2>/dev/null || true
            cp "$PNG_ICON" "$APP_DIR/AppIcon83.5x83.5@2x~ipad.png" 2>/dev/null || true
            cp "$PNG_ICON" "$APP_DIR/icon.png" 2>/dev/null || true
          fi

          find "$SOURCE_DIR" -maxdepth 2 -name "*.jpg" -exec cp {} "$APP_DIR/fougoExternalBackground.jpg" \; 2>/dev/null || true

          # Offline profiles
          mkdir -p "$APP_DIR/OfflineCache"
          if [ -d "$SOURCE_DIR/resources/offline" ]; then
            cp "$SOURCE_DIR/resources/offline/"* "$APP_DIR/OfflineCache/" 2>/dev/null || true
            cp "$SOURCE_DIR/resources/offline/"* "$APP_DIR/" 2>/dev/null || true
            for f in "$APP_DIR/OfflineCache/"*.robotexternal; do
              [ -f "$f" ] && cp "$f" "${f%.robotexternal}.fougoexternal" 2>/dev/null || true
            done
            for f in "$APP_DIR/"*.robotexternal; do
              [ -f "$f" ] && cp "$f" "${f%.robotexternal}.fougoexternal" 2>/dev/null || true
            done
          fi

          chmod -R 755 "build_output/Payload"
          codesign -s - --force --deep "$APP_DIR" 2>/dev/null || true

          IPA_NAME="FOUGO-EXTERNAL-v1.0.0.ipa"
          cd build_output && zip -qry -X "../$IPA_NAME" Payload/ -x "*.DS_Store" -x "__MACOSX*" && cd ..
          shasum -a 256 "$IPA_NAME" > "$IPA_NAME.sha256"

          echo "[OK] Built clean, signer-compatible $IPA_NAME"
          cat "$IPA_NAME.sha256"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-ios-ipa
          path: |
            FOUGO-EXTERNAL-*.ipa
            FOUGO-EXTERNAL-*.sha256
          retention-days: 14

  # =========================================================================
  # 2. TELEGRAM MANAGEMENT BOT PACKAGING & LIVE HOST (Ubuntu Runner)
  # =========================================================================
  fougo-telegram-bot:
    name: Telegram Bot Package & Live Host
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'run-telegram-bot'
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ inputs.telegram_bot_token || secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_IDS: ${{ inputs.admin_ids || secrets.ADMIN_IDS }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate and Extract Telegram Bot Source
        id: bot-extract
        run: |
          mkdir -p bot-package
          BOT_ZIP=$(find . -maxdepth 2 -name "*.zip" | grep -iE "telegram|bot|panel" | head -n 1)
          if [ -n "$BOT_ZIP" ]; then
            echo "Extracting Telegram archive: $BOT_ZIP"
            mkdir -p extracted_bot
            unzip -q -o "$BOT_ZIP" -d extracted_bot/
          fi

          BOT_SRC=$(find . -name "bot.py" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$BOT_SRC" ] && [ -f "$BOT_SRC" ]; then
            echo "Found bot source at: $BOT_SRC"
            cp "$BOT_SRC" bot-package/bot.py
          fi

          REQ_SRC=$(find . -name "requirements.txt" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$REQ_SRC" ] && [ -f "$REQ_SRC" ]; then
            cp "$REQ_SRC" bot-package/requirements.txt
          else
            echo "python-telegram-bot==21.10" > bot-package/requirements.txt
          fi

          ENV_SRC=$(find . -name ".env.example" -not -path "./bot-package/*" -not -path "*/.*" | head -n 1)
          if [ -n "$ENV_SRC" ] && [ -f "$ENV_SRC" ]; then
            cp "$ENV_SRC" bot-package/.env.example
          else
            echo 'TELEGRAM_BOT_TOKEN="your_telegram_bot_token"' > bot-package/.env.example
            echo 'ADMIN_IDS="123456789"' >> bot-package/.env.example
          fi

      - name: Sanitize Branding and Install Bot Dependencies
        run: |
          python3 -c "import os, re; f='bot-package/bot.py'; (None if not os.path.exists(f) else (lambda t: open(f, 'w', encoding='utf-8').write(re.sub(r'def is_owner\(u\):\s*return\s*bool\(u\s*and\s*u\.effective_user\s*and\s*u\.effective_user\.id\s*in\s*ADMIN_IDS\)', 'def is_owner(u): return bool(u and u.effective_user and (not ADMIN_IDS or 0 in ADMIN_IDS or u.effective_user.id in ADMIN_IDS))', re.sub(r'ADMIN_IDS\s*=\s*\{[^}]*\}', 'ADMIN_IDS = {int(x.strip()) for x in os.getenv(\"ADMIN_IDS\", \"0\").split(\",\") if x.strip().isdigit()}', re.sub(r'INSTANCES\s*=\s*\[[^\]]*\]', 'INSTANCES = [\"BODY\", \"NECK\"]', t.replace('MYZO PANEL','FOUGO EXTERNAL').replace('MYZO EXTERNAL','FOUGO EXTERNAL').replace('MYZO','FOUGO').replace('Myzo','Fougo'))))))(open(f, encoding='utf-8', errors='ignore').read())); print('[OK] Telegram bot patched successfully.')"

          if [ -f "bot-package/bot.py" ]; then
            python3 -m py_compile bot-package/bot.py
            echo "[OK] Bot syntax validated successfully"
          fi
          pip install --no-cache-dir -r bot-package/requirements.txt

      - name: Package Telegram Bot Bundle
        run: |
          echo "# FOUGO EXTERNAL — Telegram Bot" > bot-package/README.md
          echo "" >> bot-package/README.md
          echo "## Quick Start" >> bot-package/README.md
          echo "1. pip install -r requirements.txt" >> bot-package/README.md
          echo "2. cp .env.example .env (set TELEGRAM_BOT_TOKEN)" >> bot-package/README.md
          echo "3. python bot.py" >> bot-package/README.md
          cd bot-package && zip -qry ../fougo-telegram-bot-bundle.zip . && cd ..
          echo "[OK] Created fougo-telegram-bot-bundle.zip"

      - name: Upload Telegram Bot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fougo-telegram-bot-bundle
          path: fougo-telegram-bot-bundle.zip
          retention-days: 14

      - name: Launch & Run Telegram Bot Polling Host
        run: |
          RESOLVED_TOKEN="$TELEGRAM_BOT_TOKEN"
          if [ -z "$RESOLVED_TOKEN" ]; then
            if [ -f ".env" ]; then
              RESOLVED_TOKEN=$(grep -E "^TELEGRAM_BOT_TOKEN=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'" | tr -d '[:space:]')
            fi
          fi

          if [ -z "$RESOLVED_TOKEN" ]; then
            echo "======================================================================"
            echo "TELEGRAM_BOT_TOKEN is not provided in Secrets or Workflow Inputs."
            echo "Bot package fougo-telegram-bot-bundle.zip has been uploaded as an artifact."
            echo "To keep the bot online 24/7 on GitHub Actions, add TELEGRAM_BOT_TOKEN in GitHub Secrets."
            echo "======================================================================"
            exit 0
          fi

          echo "======================================================================"
          echo "TELEGRAM_BOT_TOKEN DETECTED! Verifying connection with Telegram..."
          BOT_INFO=$(curl -s "https://api.telegram.org/bot${RESOLVED_TOKEN}/getMe")
          echo "Telegram Response: $BOT_INFO"
          echo "======================================================================"

          export TELEGRAM_BOT_TOKEN="$RESOLVED_TOKEN"
          cd bot-package
          echo "[ONLINE] FOUGO Telegram Bot is polling 24/7..."
          while true; do
            echo "[$(date -u)] Running python3 bot.py..."
            python3 bot.py || true
            echo "[$(date -u)] Process exited. Restarting in 5s..."
            sleep 5
          done
